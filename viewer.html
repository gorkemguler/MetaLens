<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaLens Görüntüleyici</title>
  <link rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="ml">
  <header class="top">
    <img src="icons/32.png" width="22" height="22" alt="">
    <strong>MetaLens</strong>
    <form class="urlbar" id="form">
      <input id="url" type="url" data-i18n-placeholder="Dosya URL'si yapıştır…" autocomplete="off">
      <button class="ml-btn" type="submit" data-i18n>Analiz et</button>
      <button class="ml-btn" type="button" id="pick" data-i18n>Dosya seç…</button>
      <input id="file" type="file" multiple hidden>
    </form>
  </header>
  <div id="app"></div>
  <script src="lib/i18n.js"></script>
  <script src="lib/i18n-en.js"></script>
  <script src="lib/core.js"></script>
  <script src="lib/exif.js"></script>
  <script src="lib/images.js"></script>
  <script src="lib/pdfcrypt.js"></script>
  <script src="lib/pdf.js"></script>
  <script src="lib/office.js"></script>
  <script src="lib/media.js"></script>
  <script src="lib/analyze.js"></script>
  <script src="lib/strip.js"></script>
  <script src="lib/idb.js"></script>
  <script src="lib/loader.js"></script>
  <script src="lib/render.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
